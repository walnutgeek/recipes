name: Kopanisti
description: Greek Roasted Red Pepper Dip
src:
  - url: https://www.acommunaltable.com/kopanisti-dip/
actions:
  - name: Blend
    ingredients:
      - 340g feta cheese, drained and cubed
      - 113g roasted red bell peppers, drained
      - 1 cup fresh mint leaves
      - 52g olive oil
      - 3 small cloves garlic
      - 30g fresh lemon juice
      - 1/4 tsp red pepper flakes
