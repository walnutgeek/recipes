name: Cumin Spiced Potatoes
tags:
  - Instant Pot
actions:
  - name: Steam Potatoes
    time: 6m on high
    ingredients:
      - 2 cups water
      - 2 cups cubed potatoes
  - name: Saute Ghee Mix
    ingredients:
      - 1/2 serrano chile, cut into thick slices
      - 1/2 tsp cumin seeds
      - 1 tbsp ghee
    time: 1m
  - name: Saute
    ingredients:
      - 1/4 tsp ground turmeric (optional)
      - 1 tsp salt
