name: Discard Scones
src:
  - url: https://www.theclevercarrot.com/2023/10/easy-no-roll-sourdough-scones-overnight-option/
actions:
  - name: Dry ingredients to pulse in food processor
    ingredients:
      - 250g all purpose flour
      - 10g baking powder
      - 1/2 tsp salt
      - 100g granulated sugar
      - 170g unsalted butter, cold, cut into cubes
  - name: Wet ingredients to mix in the bowl
    ingredients:
      - 1 large egg
      - 75g sourdough discard
      - 5g pure vanilla extract
      - 60g heavy cream
      - zest of 1 lemon
  - name: Mix dough and fold in berries
    ingredients:
      - 1 cup fresh blueberries
  - name: Bake at 400F for 20-24min
