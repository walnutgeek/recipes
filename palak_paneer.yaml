name: Palak Paneer
tags:
  - Instant Pot
actions:
  - name: Saute
    ingredients:
      - 2 tsp peanut oil
      - 5 cloves garlic, chopped
      - 2 tsp ginger, minced
      - 1 serrano pepper, minced
    time: 1m on high
  - name: Pressure Cook
    time: 4m, quick pressure release
    ingredients:
      - 1 lb spinach
      - 1 large yellow onion, chopped
      - 2 medium tomatoes
      - 2 tsp ground cumin
      - 2 tsp garam masala
      - 1 tsp turmeric
      - 1 tsp salt
      - 1/2 cup water
  - name: Blend
  - name: Add Paneer
    ingredients:
      - 1.5 cup paneer, 1/2 inch cubes
