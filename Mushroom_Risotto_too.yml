name: Mushroom Risotto
src:
  - url: https://thestayathomechef.com/easy-mushroom-risotto/
actions:
  - name: Saute mushrooms until browned (3-4 min) then remove them aside
    ingredients:
      - 2 pounds white or cremini mushrooms, sliced
      - 1/2 tsp salt
      - 1/2 tsp black pepper
      - 15ml olive oil
  - name: In the same pot, saute onions for 1-2 min
    ingredients:
      - 2 large shallots
      - 30ml olive oil
  - name: Add rice and toast it for about 3 to 4 minutes until golden
    ingredients:
      - 300g arborio rice
  - name: Add 1 cup of broth and stir continuously until rice absorbs liquid, repeat adding 1/2 cup at a time until all broth is used, about 30 min
    ingredients:
      - 6 cups chicken broth
  - name: Stir in the butter, parmesan, mushrooms
    ingredients:
      - 60g salted butter
      - 1/3 cup freshly grated Parmesan cheese
      - mushrooms set aside previously
