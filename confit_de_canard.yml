name: Confit de Canard
src:
  - url: https://adamantkitchen.com/confit-de-canard/
actions:
  - name: Part ducks into 8 pieces and store in salt and aromatics for 18-24 hours
    ingredients:
      - 2 ducks
      - 2% of salt by weight (of separated pieces)
      - black pepper, few cloves of garlic, shallot, bay leaf
  - name: Cut skin and fat into 1/4" pieces and render fat
  - name: "Next day: cover pieces in rendered fat and cook for 5h at 180F"
  - name: Brown a few pieces in the pan or oven before serving
